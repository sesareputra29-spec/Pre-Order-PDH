<script>
  /**
   * PDH CAMPUS ORDER - Client Side Controller for Google Apps Script Web App
   */
  var AppState = {
    user: null,
    currentPortal: null, // 'PANITIA' or 'MAHASISWA'
    activeTab: 'dashboard',
    loading: false,
    systemInfo: null
  };

  document.addEventListener('DOMContentLoaded', function() {
    initApp();
  });

  function initApp() {
    // Check saved session in sessionStorage
    var savedUser = sessionStorage.getItem('pdh_user_session');
    if (savedUser) {
      try {
        AppState.user = JSON.parse(savedUser);
        AppState.currentPortal = AppState.user.role;
        renderPortal();
        return;
      } catch(e) {
        sessionStorage.removeItem('pdh_user_session');
      }
    }
    renderLogin();
  }

  function renderLogin() {
    var app = document.getElementById('app');
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-white to-sky-50">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
          <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-4 shadow-lg shadow-indigo-200">
              <i class="fa-solid font-bold text-2xl fa-shirt"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">PDH Campus Order</h1>
            <p class="text-sm text-gray-500 mt-1">Google Apps Script Web App System</p>
          </div>

          <div id="login-alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

          <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Username</label>
              <input type="text" id="input-username" required placeholder="Masukkan username" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
            </div>

            <div>
              <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Password</label>
              <input type="password" id="input-password" required placeholder="Masukkan password" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
            </div>

            <button type="submit" id="btn-submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium text-sm transition shadow-md shadow-indigo-100 flex items-center justify-center gap-2">
              <span>Masuk Aplikasi</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
          </form>

          <div class="mt-6 pt-6 border-t border-gray-100">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 text-center">Akun Testing Quick-Fill</p>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="fillTestAcc('admin', '123')" class="p-2 border border-gray-200 rounded-lg text-xs text-left hover:bg-gray-50">
                <div class="font-bold text-gray-800">Panitia</div>
                <div class="text-gray-500">admin / 123</div>
              </button>
              <button type="button" onclick="fillTestAcc('mhs', '123')" class="p-2 border border-gray-200 rounded-lg text-xs text-left hover:bg-gray-50">
                <div class="font-bold text-gray-800">Mahasiswa</div>
                <div class="text-gray-500">mhs / 123</div>
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function fillTestAcc(u, p) {
    document.getElementById('input-username').value = u;
    document.getElementById('input-password').value = p;
  }

  function handleLogin(e) {
    e.preventDefault();
    var u = document.getElementById('input-username').value;
    var p = document.getElementById('input-password').value;
    var btn = document.getElementById('btn-submit');
    var alert = document.getElementById('login-alert');

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Memverifikasi...</span>`;
    alert.classList.add('hidden');

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk Aplikasi</span><i class="fa-solid fa-arrow-right text-xs"></i>`;

        if (res.success && res.data) {
          AppState.user = res.data;
          AppState.currentPortal = res.data.role;
          sessionStorage.setItem('pdh_user_session', JSON.stringify(res.data));
          renderPortal();
        } else {
          alert.className = 'mb-4 p-3 rounded-lg text-sm bg-rose-50 text-rose-700 border border-rose-200';
          alert.innerText = res.message || 'Login gagal';
          alert.classList.remove('hidden');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk Aplikasi</span><i class="fa-solid fa-arrow-right text-xs"></i>`;
        alert.className = 'mb-4 p-3 rounded-lg text-sm bg-rose-50 text-rose-700 border border-rose-200';
        alert.innerText = 'Error server: ' + err.message;
        alert.classList.remove('hidden');
      })
      .loginUser({ username: u, password: p });
  }

  function logout() {
    sessionStorage.removeItem('pdh_user_session');
    AppState.user = null;
    AppState.currentPortal = null;
    renderLogin();
  }

  function renderPortal() {
    if (AppState.currentPortal === 'PANITIA') {
      renderPanitiaPortal();
    } else {
      renderMahasiswaPortal();
    }
  }

  function renderPanitiaPortal() {
    var app = document.getElementById('app');
    app.innerHTML = `
      <div class="flex h-screen bg-gray-100 overflow-hidden">
        <!-- Sidebar Panitia -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0">
          <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">
                P
              </div>
              <span class="font-bold text-white text-sm">Portal Panitia</span>
            </div>
          </div>

          <nav class="flex-1 overflow-y-auto p-3 space-y-1 text-sm custom-scrollbar">
            <a href="#" onclick="switchTab('dashboard')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 text-white font-medium">
              <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
            </a>
            <a href="#" onclick="switchTab('pesanan')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800">
              <i class="fa-solid fa-box-archive w-5"></i> Pesanan
            </a>
            <a href="#" onclick="switchTab('mahasiswa')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800">
              <i class="fa-solid fa-users w-5"></i> Data Mahasiswa
            </a>
            <a href="#" onclick="switchTab('pembayaran')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800">
              <i class="fa-solid fa-credit-card w-5"></i> Pembayaran
            </a>
            <a href="#" onclick="switchTab('produksi')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800">
              <i class="fa-solid fa-industry w-5"></i> Produksi
            </a>
            <a href="#" onclick="switchTab('pengaturan_pdh')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800">
              <i class="fa-solid fa-shirt w-5"></i> Pengaturan PDH
            </a>
            <a href="#" onclick="switchTab('import_export')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800">
              <i class="fa-solid fa-file-import w-5"></i> Import / Export
            </a>
            <a href="#" onclick="switchTab('user_akses')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800">
              <i class="fa-solid fa-user-shield w-5"></i> User & Akses
            </a>
            <a href="#" onclick="switchTab('pengaturan_sistem')" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800">
              <i class="fa-solid fa-gear w-5"></i> Pengaturan Sistem
            </a>
          </nav>

          <div class="p-3 border-t border-slate-800">
            <div class="flex items-center justify-between text-xs">
              <div>
                <p class="font-semibold text-white">${AppState.user.name}</p>
                <p class="text-slate-400">Panitia Admin</p>
              </div>
              <button onclick="logout()" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
                <i class="fa-solid fa-right-from-bracket"></i>
              </button>
            </div>
          </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col overflow-y-auto">
          <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <h2 id="page-title" class="text-lg font-bold text-gray-800 capitalize">Dashboard Panitia</h2>
            <span class="px-2.5 py-1 text-xs font-semibold rounded-full badge-panitia">PORTAL PANITIA</span>
          </header>

          <div id="portal-content" class="p-6 space-y-6">
            <!-- Dynamic view content -->
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
              <h3 class="text-base font-bold text-gray-900 mb-2">Selamat Datang di Portal Panitia</h3>
              <p class="text-sm text-gray-600">Fondasi Google Apps Script Web App berhasil dimuat. Pilih menu di sidebar kiri untuk menavigasi.</p>
            </div>
          </div>
        </main>
      </div>
    `;
  }

  function renderMahasiswaPortal() {
    var app = document.getElementById('app');
    app.innerHTML = `
      <div class="min-h-screen bg-gray-50 flex flex-col">
        <!-- Top Nav -->
        <header class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-10 flex items-center justify-between shadow-sm">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold text-sm">
              M
            </div>
            <div>
              <h1 class="font-bold text-sm text-gray-900">PDH Campus Order</h1>
              <p class="text-xs text-gray-500">Portal Mahasiswa</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 text-xs font-semibold rounded-full badge-mahasiswa">MAHASISWA</span>
            <button onclick="logout()" class="p-2 text-gray-500 hover:text-gray-800">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="bg-white border-b border-gray-200 px-4 flex gap-1 overflow-x-auto text-sm font-medium">
          <button onclick="switchMhsTab('beranda')" class="py-3 px-3 text-emerald-600 border-b-2 border-emerald-600 font-semibold whitespace-nowrap">Beranda</button>
          <button onclick="switchMhsTab('pesan')" class="py-3 px-3 text-gray-500 hover:text-gray-900 whitespace-nowrap">Pesan PDH</button>
          <button onclick="switchMhsTab('pesanan_saya')" class="py-3 px-3 text-gray-500 hover:text-gray-900 whitespace-nowrap">Pesanan Saya</button>
          <button onclick="switchMhsTab('pembayaran')" class="py-3 px-3 text-gray-500 hover:text-gray-900 whitespace-nowrap">Pembayaran</button>
          <button onclick="switchMhsTab('progres')" class="py-3 px-3 text-gray-500 hover:text-gray-900 whitespace-nowrap">Progres PDH</button>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 p-4 max-w-2xl mx-auto w-full space-y-4">
          <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
            <h2 class="font-bold text-gray-900 mb-1">Halo, ${AppState.user.name} 👋</h2>
            <p class="text-sm text-gray-600">Selamat datang di Portal Mahasiswa Pemesanan PDH Kampus.</p>
          </div>
        </main>
      </div>
    `;
  }

  function switchTab(tab) {
    AppState.activeTab = tab;
    var title = document.getElementById('page-title');
    if (title) title.innerText = tab.replace('_', ' ');
  }

  function switchMhsTab(tab) {
    AppState.activeTab = tab;
  }

  // Master PDH Client API Calls
  function loadPDHMasterData(callback) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success && callback) callback(res.data);
      })
      .getPDHMasterData();
  }
</script>
